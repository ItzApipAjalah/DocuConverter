<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Documentation | DocuConvert</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .text-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #redoc-container {
      margin-top: -2rem;
    }

    /* Hide ReDoc header if any */
    .menu-content img {
      display: none;
    }
  </style>
</head>

<body class="antialiased">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 px-4 md:px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center glass rounded-2xl px-5 py-3 shadow-sm">
      <a href="/" class="flex items-center gap-2 md:gap-3">
        <div
          class="w-9 h-9 md:w-10 md:h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-indigo-200 shadow-lg">
          <i class="fa-solid fa-code text-white text-sm md:text-base"></i>
        </div>
        <span class="text-lg md:text-xl font-bold text-slate-800 tracking-tight">DocuConvert <span
            class="text-indigo-600">API</span></span>
      </a>
      <nav class="flex items-center gap-4 md:gap-8">
        <a href="/"
          class="text-slate-600 hover:text-indigo-600 font-medium transition-colors flex items-center gap-2 text-sm md:text-base">
          <i class="fa-solid fa-house-chimney text-xs md:text-sm"></i> <span class="hidden sm:inline">Home</span>
        </a>
        <a href="https://github.com/ItzApipAjalah/DocuConverter" target="_blank"
          class="text-slate-600 hover:text-indigo-600 font-medium transition-colors">
          <i class="fa-brands fa-github text-xl"></i>
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-28 md:pt-32 pb-12 md:pb-20 px-6 bg-gradient-to-b from-indigo-50/50 to-transparent">
    <div class="max-w-7xl mx-auto text-center">
      <h1 class="text-3xl md:text-5xl font-bold text-slate-900 mb-4 md:mb-6 tracking-tight">
        DocuConvert <span class="text-gradient">API Reference</span>
      </h1>
      <p class="text-base md:text-lg text-slate-600 max-w-2xl mx-auto leading-relaxed px-4">
        Simple endpoints for document conversion and PDF manipulation.
      </p>
    </div>
  </section>

  <!-- Documentation Container -->
  <div class="max-w-7xl mx-auto px-4 md:px-6 mb-10 md:mb-20">
    <div
      class="bg-white rounded-2xl md:rounded-3xl shadow-xl shadow-slate-200/50 overflow-hidden border border-slate-100">
      <div id="redoc-container"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-12 border-t border-slate-200">
    <div class="max-w-7xl mx-auto px-6 text-center text-slate-500 text-sm">
      &copy; 2024 DocuConvert API. Built for developers.
    </div>
  </footer>

  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"> </script>
  <script>
    Redoc.init('openapi.yaml', {
      theme: {
        colors: {
          primary: {
            main: '#4f46e5'
          },
          success: {
            main: '#10b981'
          },
          warning: {
            main: '#f59e0b'
          },
          error: {
            main: '#ef4444'
          },
          text: {
            primary: '#1e293b'
          }
        },
        typography: {
          fontFamily: 'Outfit, sans-serif',
          headings: {
            fontFamily: 'Outfit, sans-serif',
            fontWeight: '700'
          },
          code: {
            fontFamily: 'JetBrains Mono, monospace',
            backgroundColor: '#f1f5f9'
          }
        },
        sidebar: {
          width: '260px',
          backgroundColor: '#ffffff'
        },
        rightPanel: {
          backgroundColor: '#1e293b'
        }
      },
      layout: {
        scope: 'all'
      }
    }, document.getElementById('redoc-container'))
  </script>
</body>

</html>
