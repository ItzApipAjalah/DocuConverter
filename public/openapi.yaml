openapi: 3.0.3
info:
  title: DocuConvert API
  description: |
    A powerful, secure, and multi-format document conversion API.
    Convert between PDF, Word, Excel, PowerPoint, and Jupyter Notebooks with ease.
  version: 1.0.0
  contact:
    name: AMWP Support
servers:
  - url: /api
    description: Current Server

tags:
  - name: Conversion
    description: Document conversion operations
  - name: File Management
    description: File metadata and download operations

paths:
  /convert/{type}:
    post:
      tags:
        - Conversion
      summary: Convert or Manipulate Documents
      description: |
        Primary endpoint for all document operations. 
        Upload one or more files using the `file` field.
      operationId: convertDocument
      x-code-samples:
        - lang: JavaScript
          label: Node.js (Fetch)
          source: |
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            // Optional: formData.append('options', '1-3,5');

            const response = await fetch('/api/convert/word-to-pdf', {
              method: 'POST',
              body: formData
            });
            const data = await response.json();
            console.log(data.downloadUrl);
        - lang: Python
          label: Python (Requests)
          source: |
            import requests

            url = "http://localhost:3000/api/convert/word-to-pdf"
            files = [('file', open('document.docx', 'rb'))]
            # payload = {'options': '1,3,5'}
            
            response = requests.post(url, files=files)
            print(response.json())
      parameters:
        - name: type
          in: path
          required: true
          description: The type of conversion/operation to perform.
          schema:
            type: string
            enum:
              - word-to-pdf
              - excel-to-pdf
              - ppt-to-pdf
              - pdf-to-word
              - pdf-to-excel
              - pdf-to-ppt
              - ipynb-to-pdf
              - merge-pdf
              - split-pdf
              - remove-pages
              - extract-pages
              - image-to-pdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more files to process.
                options:
                  type: string
                  description: |
                    Configuration for specific tools:
                    - **remove-pages / extract-pages**: Page range (e.g., "1,3,5-10")
                    - **image-to-pdf**: JSON string e.g., `{"orientation":"portrait", "pageSize":"a4", "margin":"small"}`
              required:
                - file
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  filename:
                    type: string
                  downloadUrl:
                    type: string
        '400':
          description: Invalid request
        '500':
          description: Server error

  /info/{id}:
    get:
      tags:
        - File Management
      summary: Get file metadata
      description: Retrieves the metadata associated with a previously converted file.
      operationId: getFileInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File metadata retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  file:
                    type: object
                    properties:
                      id:
                        type: string
                      filename:
                        type: string
                      downloadUrl:
                        type: string
        '404':
          description: File not found
        '500':
          description: Server error

  /download/{id}:
    get:
      tags:
        - File Management
      summary: Download converted file
      description: Downloads the binary content of the converted file.
      operationId: downloadFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The binary file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '500':
          description: Server error
